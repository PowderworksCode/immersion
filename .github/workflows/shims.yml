# The client shims are TypeScript; the crate embeds the compiled JavaScript.
#
# That split is deliberate: `cargo build` must not need a JavaScript toolchain
# (the container image that ships powderman has none), so the generated .js is
# committed. This job keeps the two honest — it typechecks the source and fails
# if the committed output has drifted from it.
name: Shims

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: shims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shims:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned, not `latest`. The lockfile pins what goes *into* the vendor
      # bundle; the bundler is an input too, and it was not pinned — so a Bun
      # release that mangles identifiers differently makes the committed
      # bundle "stale" against itself and turns every open pull request red
      # without anyone changing a line. That is what happened between the 18th
      # and the 21st.
      #
      # Bumping this is a real change: bump it, run `bun run build:vendor`, and
      # commit the rebuilt bundle in the same commit.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      # The wire types are generated from Rust; regenerate before typechecking
      # so a Rust-side change that the TypeScript has not caught up with fails
      # here rather than at runtime.
      - name: Regenerate the wire bindings
        run: cargo test -p immersion export_bindings

      - name: Typecheck
        run: bunx tsc --noEmit

      # The vendored renderer is built from immersion/ts/vendor and committed.
      # Rebuilding here proves the committed bundle matches its source: a
      # dependency bump that nobody rebuilt would otherwise ship the old
      # renderer forever.
      - name: Vendored renderers are up to date
        run: |
          bun install --frozen-lockfile
          bun run build:vendor
          git diff --exit-code -- immersion/vendor \
            || { echo "::error::a vendored renderer is stale — run 'bun run build:vendor' and commit"; exit 1; }

      - name: Generated shims are up to date
        run: |
          bun run scripts/build-shims.ts
          git diff --exit-code -- immersion/src/*.js immersion/ts/generated \
            || { echo "::error::generated output is stale — run 'cargo test -p immersion export_bindings && bun run build' and commit"; exit 1; }
