# Deploy main to the public demo — https://powderman-demo.fly.dev
#
# The app runs in demo mode (POWDERMAN_DEMO=1, set in fly.toml): a fabricated
# history, a DEMO badge, triggers refused. A Fly machine has no herdr and no
# checkout, so there is nothing real for it to run; see powderman/src/demo.rs.
#
# No test gate here on purpose — the Docker build compiles the workspace, so a
# main that does not build cannot deploy, and CI already gates the PR.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges in quick succession would otherwise race to release different
# images. Newer wins; the older is cancelled before it deploys.
concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      # First deploy against a fresh org has no app yet. Creating it here keeps
      # the workflow self-contained rather than requiring a manual `fly launch`.
      - name: Ensure the app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
        run: |
          if flyctl status --app powderman-demo >/dev/null 2>&1; then
            echo "app exists"
            exit 0
          fi
          # `apps create --org` wants the slug ("personal"), not the display
          # name ("Zack Maril") — passing the name fails with "organization not
          # found", which is how the first run of this workflow died. In the
          # map form the slug is the KEY; the array form spells it Slug.
          ORG="${{ vars.FLY_ORG }}"
          if [ -z "$ORG" ]; then
            ORG=$(flyctl orgs list --json |
              jq -r 'if type == "array" then (.[0].Slug // .[0].slug) else keys[0] end')
          fi
          echo "creating powderman-demo in org '$ORG'"
          # Guessing an org is the fragile step here, so a failure says exactly
          # what to run by hand rather than leaving the slug to be inferred
          # from a jq error.
          if ! flyctl apps create powderman-demo --org "$ORG"; then
            echo "::error::could not create the app in org '$ORG'. Run"
            echo "::error::  fly apps create powderman-demo --org <slug>"
            echo "::error::(see 'fly orgs list'), or set the FLY_ORG repo variable."
            exit 1
          fi

      # The remote builder is fast (it keeps the cargo-chef layers warm) but
      # intermittently cannot reach Fly's own registry — see #67. Same fix as
      # the preview workflow: fall back to building on the runner.
      - name: Deploy
        id: deploy
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
        run: flyctl deploy --config fly.toml --dockerfile Dockerfile --remote-only

      - name: Deploy (local build fallback)
        if: steps.deploy.outcome == 'failure'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
        run: flyctl deploy --config fly.toml --dockerfile Dockerfile --local-only

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://powderman-demo.fly.dev/health | grep -q '"ok":true'; then
              echo "demo is up"; exit 0
            fi
            sleep 5
          done
          echo "demo did not come up healthy"; exit 1
