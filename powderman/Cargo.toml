[package]
name = "powderman"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Durable workflows on SQLite. herdr runs the agents; systemd runs everything else."

[dependencies]
immersion = { path = "../immersion", features = ["schema"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = "0.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }

# Herdr's socket, typed, from the people who wrote the socket. It is
# synchronous by design (blocking UnixStream), so calls belong in
# spawn_blocking once the async daemon is driving them.
herdr-sdk = "0.0.1"

# The UI, same stack cowbird uses: server-rendered and reactive over a
# websocket, so the browser holds no state and there is no build step.
dioxus = { version = "0.7.10", features = ["liveview", "router"] }
dioxus-liveview = { version = "0.7.10", features = ["axum"] }
axum = "0.8.9"

# The workbench as an MCP server: the command bus exposed as first-class,
# typed tools an agent discovers and calls natively — mounted in-process on
# the same axum router, sharing daemon state. schemars 1.0 must match rmcp's.
rmcp = { version = "3.1.2", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
schemars = "1.0"
similar = "3.1.2"


[dev-dependencies]
tempfile = "3.27.0"
