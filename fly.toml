# The public demo: main, deployed on every merge by .github/workflows/deploy.yml.
# Previews use fly.preview.toml instead (they idle-stop; this does not).
#
# A Fly deploy has no herdr and no systemd, so the fleet and run execution are
# inert here — which is why this runs in demo mode rather than pretending
# otherwise. POWDERMAN_DEMO=1 seeds a fabricated history so the workbench has
# something to render, badges the status bar DEMO, and refuses triggers. See
# powderman/src/demo.rs.
#
# The database is on the machine's ephemeral disk, deliberately: no volume
# means every deploy starts from the same seed, so whatever visitors do to the
# layout is undone by the next merge rather than accumulating forever.

app = "powderman-demo"
primary_region = "ewr"

[env]
  POWDERMAN_DEMO = "1"
  # Belt and braces: demo mode already refuses triggers, but a schedule firing
  # 06:00 treebank_sweep on a machine with no checkout is not worth the risk.
  POWDERMAN_SCHEDULES = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    idle_timeout = 900

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
